name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python scripts/generate.py
      - run: git diff --exit-code -- research/audits skills/startup-landing-design/references/casebook.md
      - run: npm run validate
      - run: agentskills validate skills/startup-landing-design
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
